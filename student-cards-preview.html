<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LexLearn | معاينة بطاقات الطلاب</title><link rel="icon" href="assets/lexlearn-logo.svg"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--navy:#111d31;--wine:#8a1f39;--paper:#f9f4ef}*{box-sizing:border-box}body{margin:0;background:#eee8e2;color:var(--navy);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:24px}.toolbar h1{margin:0;font-size:24px}button{border:0;background:var(--wine);color:white;padding:11px 20px;border-radius:12px;cursor:pointer;font:inherit;font-weight:700}.note{color:#5e6070;font-size:13px;margin:10px 0 24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px}.id-card{background:var(--paper);border:1px solid #d7c7bd;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px #111d3120;break-inside:avoid}.head{background:linear-gradient(125deg,#111d31 15%,#283652 65%,#8a1f39 160%);color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand img{width:47px;height:47px;object-fit:contain}.brand strong{font-size:22px;letter-spacing:.2px}.brand small{display:block;font-size:10px;color:#ddd4dc}.tag{border:1px solid #ffffff65;border-radius:99px;padding:5px 10px;font-size:10px}.body{padding:22px}.person{display:flex;gap:15px;align-items:center;margin-bottom:18px}.avatar{background:#e9deda;border:1px solid #d8c5c3;border-radius:16px;width:65px;height:65px;display:grid;place-items:center;font-size:30px;color:var(--wine)}.person h2{font-size:19px;margin:0 0 5px}.person p{font-size:12px;color:#656777;margin:2px 0}.meta{border-top:1px solid #ded4cd;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta label{font-size:10px;color:#73717a;display:block}.meta strong{font-size:13px}.bottom{margin-top:18px;background:#fff;border:1px solid #e6ddd7;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.qr{width:77px;height:77px;border:2px dashed #a5a4a6;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:10px;color:#777;padding:5px}.foot{font-size:10px;color:#6d6670;text-align:center;margin-top:12px}@media print{body{background:white}.toolbar,.note{display:none}.wrap{padding:0}.cards{grid-template-columns:1fr 1fr;gap:12mm}.id-card{box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}}@media(max-width:600px){.wrap{padding:14px}.toolbar h1{font-size:19px}}</style></head><body><main class="wrap"><div class="toolbar"><h1>معاينة بطاقات الطلاب | LexLearn</h1><button onclick="window.print()">طباعة / حفظ PDF</button></div><p class="note">نموذج تجريبي ببيانات افتراضية، مستوحى من ألوان وشعار الموقع. رمز التفعيل غير مُنشأ حتى ربطه بنظام الحسابات الآمن.</p><div class="cards" id="cards"></div></main>
<script>
const students=[{name:'أحمد محمد علي',id:'LL-AJU-0001',user:'AJU-0001'},{name:'مريم خالد حسن',id:'LL-AJU-0002',user:'AJU-0002'},{name:'عمر محمود سالم',id:'LL-AJU-0003',user:'AJU-0003'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('cards').innerHTML=students.map(s=>'<article class="id-card"><div class="head"><div class="brand"><img src="assets/lexlearn-logo.svg" alt="LexLearn"><div><strong>LexLearn</strong><small>Adaptive Legal Learning</small></div></div><span class="tag">STUDENT ID</span></div><div class="body"><div class="person"><div class="avatar">♙</div><div><h2>'+esc(s.name)+'</h2><p>جامعة عجمان | كلية القانون</p><p>الفرقة الأولى</p></div></div><div class="meta"><div><label>الرقم التعريفي</label><strong dir="ltr">'+esc(s.id)+'</strong></div><div><label>اسم المستخدم</label><strong dir="ltr">'+esc(s.user)+'</strong></div><div><label>المادة</label><strong>مدخل القانون ونظرية الحق</strong></div><div><label>الحالة</label><strong>بانتظار التفعيل</strong></div></div><div class="bottom"><div><strong>تفعيل حساب الطالب</strong><p style="font-size:11px;color:#777;margin:4px 0">يصدر رمز QR الآمن بعد اعتماد الحساب</p></div><div class="qr">QR<br>قيد الربط</div></div><div class="foot">نفهم طريقة تفكيرك، ونبني طريقك.</div></div></article>').join('');
</script></body></html>
