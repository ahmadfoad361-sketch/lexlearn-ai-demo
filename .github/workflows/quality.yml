          psql -v ON_ERROR_STOP=1 -f tests/sql/site-activity-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028041128_supervisor_activity.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/academic-alias-acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/site-activity-acceptance.sql
