name: LexLearn quality checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check assets/adaptive-engine.js
          node --check assets/content.js
          node --check assets/app.js
          node --check namaa/assets/app.js
          node --check assets/v9-law-content.js
          node --check assets/v9-law.js
          node --check assets/showcase.js
          node --check assets/showcase-learning-cycle.js
          node --check assets/showcase-en.js
          node --check assets/official-level-one.js
          node --check assets/server-diagnostic.js
          node --check assets/student-practice.js
          node --check assets/student-path.js
          node --check assets/official-diagnostic.js
          node --check assets/program-en.js
          node --check assets/student-en.js
          node --check assets/server-diagnostic.js
          node --check assets/program-en.js
          node --check assets/program.js
          node --check assets/cloud-data.js
          node --check assets/student-login.js
          node --check assets/admin-login-v2.js
          node --check assets/student.js
          node --check assets/admin-entry.js
          node --check assets/admin-cloud.js
          node --check assets/pilot-learning.js
          node --check assets/pilot0.js
      - name: Setup Deno for edge-function typecheck
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check diagnostic AI Edge Function
        run: |
          deno check supabase/functions/lexlearn-diagnostic-ai-grade/index.ts
          deno check supabase/functions/lexlearn-grading-smoke/index.ts
          deno check supabase/functions/student-register-whatsapp/index.ts
          deno check supabase/functions/admin-manage-instructors/index.ts
          deno check supabase/functions/site-activity/index.ts
          deno check supabase/functions/admin-site-stats/index.ts
          deno check supabase/functions/admin-manage-student/index.ts
      - name: Adaptive engine tests
        run: |
          node tests/adaptive-engine.test.js
          node tests/learning-quality.test.js
          node tests/diagnostic-evidence.test.js
          node tests/public-showcase.test.js
          node tests/showcase-semantic.test.mjs
          node tests/showcase-learning-cycle.test.js
          node tests/semantic-service.test.js
          node tests/review-bank.test.js
          node tests/pilot-learning.test.js
          node tests/pilot-grade-service.test.js
          node tests/pilot-readiness.test.js
          node tests/pilot-supervisor-audit.test.js
          node tests/instructor-platform.test.js
          node tests/instructor-summary-privacy.test.js
          node tests/instructor-password-session.test.js
          node tests/professor-entry-links.test.js
          node tests/supervisor-password-resets.test.js
          node tests/admin-navigation-login-help.test.js
          node tests/supervisor-country-tree.test.js
          node tests/supervisor-cohort-management.test.js
          node tests/site-analytics.test.js
          node tests/student-academic-profile-update.test.js
          node scripts/validate-pilot-grading.js
          node tests/program-flow.test.js
          node tests/official-diagnostic.test.js
          node tests/official-diagnostic-dom-flow.test.js
          node tests/server-diagnostic-ui.test.js
          node tests/diagnostic-ai-v2.test.mjs
          node tests/consent-once.test.js
          node tests/diagnostic-layout.test.js
          node tests/student-gate-source.test.js
          node tests/student-provisional-flow.test.js
          node tests/founder-pilot-release.test.js
          node tests/student-full-path.test.js
          node tests/legal-case-guide.test.js
          node tests/official-level-one-ui.test.js
      - name: Production boundary tests
        run: node tests/production-boundaries.test.js
      - name: Build public artifact
        run: node scripts/build-public.js
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instructor email regression coverage
        run: |
          node tests/instructor-email.test.mjs
          node tests/site-activity-edge.test.mjs

  lifecycle-postgres:
    name: Server diagnostic PostgreSQL + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lexlearn_ci_only
          POSTGRES_DB: lexlearn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lexlearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: lexlearn_ci_only
      PGDATABASE: lexlearn_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Boot isolated schema and verify proposed migration
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/lifecycle-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_001_student_diagnostic_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_004_diagnostic_not_sure_neutral.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_005_diagnostic_pilot_completion_consistency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_006_student_pilot_profile_fields.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_002_official_level_one.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_003_internal_provisional_essay_grading.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022_002_diagnostic_three_element_rubric.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024_001_diagnostic_short_answer_rule_coverage.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/lifecycle-scenarios.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/level-one-acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/internal-grader-acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/diagnostic-three-element-acceptance.sql

  public-preview-chrome:
    name: Published-artifact-equivalent Chrome AR/EN and mobile/desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Build public output and run real Chrome
        run: |
          node scripts/build-public.js
          python3 -m http.server 18765 --bind 127.0.0.1 --directory dist-site >/tmp/lexlearn-lifecycle-serve.log 2>&1 &
          sleep 2
          node tests/student-path-browser.cjs
          node tests/legal-case-guide-browser.cjs
          node tests/student-adaptive-browser.cjs
          node tests/conference-viewport-browser.cjs
          LEX_VIDEO_DIR=supervisor-browser-evidence node tests/supervisor-published-browser.cjs
          node tests/site-stats-browser.cjs
          node tests/brand-wordmark-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supervisor-browser-evidence
          path: supervisor-browser-evidence/
          if-no-files-found: ignore

  sql-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lexlearn_test_only
          POSTGRES_DB: lexlearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexlearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: lexlearn_test_only
      PGDATABASE: lexlearn_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply minimal isolated fixture and proposed migration
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/lifecycle-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_001_student_diagnostic_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_004_diagnostic_not_sure_neutral.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_005_diagnostic_pilot_completion_consistency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_006_student_pilot_profile_fields.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_002_official_level_one.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_003_internal_provisional_essay_grading.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022_002_diagnostic_three_element_rubric.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024_001_diagnostic_short_answer_rule_coverage.sql
      - name: Run real PostgreSQL RLS, idempotency and level progression cases
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/lifecycle-acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/level-one-acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/internal-grader-acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/diagnostic-three-element-acceptance.sql

  founder-pilot-postgres:
    name: Founder-authorized diagnostic and stage-one PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lexlearn_local_fixture
          POSTGRES_DB: lexlearn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lexlearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: lexlearn_local_fixture
      PGDATABASE: lexlearn_test
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Check safe founder pilot release in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/lifecycle-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_001_student_diagnostic_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_004_diagnostic_not_sure_neutral.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_005_diagnostic_pilot_completion_consistency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023_006_student_pilot_profile_fields.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_002_official_level_one.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_003_internal_provisional_essay_grading.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022_002_diagnostic_three_element_rubric.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024_001_diagnostic_short_answer_rule_coverage.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/founder-pilot-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_004_founder_authorized_pilot_release.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/founder-pilot-acceptance.sql

  full-adaptive-postgres:
    name: All thirty adaptive stages and confidential lesson feedback, PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lexlearn_full_path_ci
          POSTGRES_DB: lexlearn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lexlearn_test"
