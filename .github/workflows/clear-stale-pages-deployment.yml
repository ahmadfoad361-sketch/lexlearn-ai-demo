name: Safely remove stale failed Pages deployment record
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/clear-stale-pages-deployment.yml']
permissions:
  contents: read
  deployments: write
jobs:
  clear-only-known-failed-record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify sha and failed status then delete only obsolete deployment 7070601033
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          expected='e9efed2a10e9a1b95d8eb93c43afa2162c00c2cd'
          ident='7070601033'
          headers={'Accept':'application/vnd.github+json',
                   'Authorization':'Bearer '+token,
                   'X-GitHub-Api-Version':'2022-11-28'}
          base='https://api.github.com/repos/'+repo+'/deployments/'+ident
          def call(url,method='GET'):
              req=urllib.request.Request(url,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      b=response.read()
                      return response.status,json.loads(b) if b else None
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf8','replace')
                  print('GitHub response',e.code,'message',body[:300])
                  return e.code,None
          code,dep=call(base)
          if code==404:
              print('Old deployment record already absent. No changes necessary.')
              raise SystemExit(0)
          if code!=200 or not isinstance(dep,dict):
              raise SystemExit('Cannot validate target deployment. No changes made.')
          print('Found deployment',ident,'sha',dep.get('sha'),'environment',dep.get('environment'))
          if dep.get('sha')!=expected or dep.get('environment')!='github-pages':
              raise SystemExit('Target does not match exact obsolete Pages deployment. Refusing changes.')
          code,states=call(base+'/statuses?per_page=5')
          if code!=200 or not isinstance(states,list) or not states:
              raise SystemExit('Cannot verify deployment terminal status. Refusing changes.')
          current=states[0].get('state')
          print('Verified latest target status:',current)
          if current not in ('failure','error','inactive'):
              raise SystemExit('Target is not a failed terminal deployment. No changes made.')
          code,_=call(base,'DELETE')
          if code==204:
              print('SUCCESS: deleted obsolete failed deployment 7070601033 only.')
              print('Last successful deployed site and all site files untouched.')
          else:
              raise SystemExit('Unable to remove obsolete failed record; published site unchanged.')
          PY
