name: LexLearn Recall Grading Smoke Tests
on:
  push:
    paths:
      - 'assets/showcase-recall.js'
      - 'tests/showcase-recall-smoke.cjs'
      - '.github/workflows/recall-smoke.yml'
  pull_request:
    paths:
      - 'assets/showcase-recall.js'
      - 'tests/showcase-recall-smoke.cjs'
jobs:
  recall-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test conservative legal recall
        run: node tests/showcase-recall-smoke.cjs
