name: LexLearn one-time live showcase smoke
on:
  push:
    paths:
      - '.github/workflows/showcase-live-smoke.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Probe anonymous guest sign-in and guarded demo function (no grading)
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cfg=fs.readFileSync('assets/lexlearn-config.js','utf8');
          const key=cfg.match(/supabaseAnonKey:"([^"]+)"/)?.[1];
          const url=cfg.match(/supabaseUrl:"([^"]+)"/)?.[1];
          if(!key||!url)throw Error('missing_public_configuration');
          async function main(){
            const result=await fetch(url+'/auth/v1/signup',{method:'POST',headers:{'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({data:{}})});
            const payload=await result.json();
            console.log('GUEST_AUTH_HTTP',result.status,'ACCESS_TOKEN_RECEIVED',!!payload.access_token,'ERROR_CODE',payload.error_code||payload.code||'none','MESSAGE',String(payload.msg||payload.message||'').slice(0,170));
            if(!payload.access_token) return;
            const guarded=await fetch(url+'/functions/v1/showcase-grade',{method:'POST',headers:{'apikey':key,'Authorization':'Bearer '+payload.access_token,'Content-Type':'application/json','Origin':'https://ahmadfoad361-sketch.github.io'},body:JSON.stringify({})});
            const detail=await guarded.json();
            console.log('EDGE_GUARD_HTTP',guarded.status,'EDGE_GUARD_REASON',detail.error||'none','EXPECTED',guarded.status===400&&detail.error==='invalid_demo_payload');
          }
          main().catch(e=>{console.error('SMOKE_ERROR',e.message);process.exit(1)});
          NODE
