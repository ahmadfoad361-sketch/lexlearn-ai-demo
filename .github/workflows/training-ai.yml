name: Personal training and pilot registration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/training-ai.test.mjs
      - run: node tests/training-ai-client.test.js
      - run: node tests/admin-pilot-registration.test.mjs
      - run: node tests/legal-study.test.js


