name: LexLearn cohort bulk onboarding and archive UI tests
on:
  push:
    branches: ["feature/admin-cohort-bulk-enrollment-archive-*"]
  pull_request:
    paths:
      - "admin-bulk.html"
      - "admin-archive.html"
      - "assets/admin-bulk*"
      - "assets/admin-archive*"
      - "assets/admin-cloud.js"
      - "tests/admin-bulk-parser.test.cjs"
      - ".github/workflows/cohort-bulk-archive.yml"
permissions:
  contents: read
jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate backend-free parser, ZIP format, security constraints and syntax
        run: node --test tests/admin-bulk-parser.test.cjs
      - name: Verify group links and restricted standalone workflow
        run: |
          grep -q 'admin-bulk.html?cohort=' assets/admin-cloud.js
          grep -q 'admin-archive.html?cohort=' assets/admin-cloud.js
          grep -q 'دون كلمات مرور' admin-bulk.html
          grep -q 'student.accountStatus' assets/admin-cloud.js
