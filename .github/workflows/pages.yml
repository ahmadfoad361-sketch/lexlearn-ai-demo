name: Deploy LexLearn AI demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check all shipped JavaScript
        run: |
          for f in assets/*.js namaa/assets/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Production guardrails
        run: |
          ! grep -R "async async" assets
          test -f privacy.html
          test -f terms.html
          test -f supabase/migrations/20261006_001_production_core.sql
          test -f supabase/migrations/20261006_002_hardening_and_qatar_curriculum.sql
          test -f supabase/functions/grade-answer/index.ts
      - name: Adaptive engine tests
        run: node tests/adaptive-engine.test.js
      - name: Production boundary tests
        run: node tests/production-boundaries.test.js

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build public artifact
        run: node scripts/build-public.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist-site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
