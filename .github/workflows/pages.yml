name: Deploy LexLearn public interface
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public scripts
        run: |
          for f in assets/*.js scripts/*.js scripts/*.cjs; do node --check "$f"; done
      - name: Verify identity cards and QR safety
        run: node scripts/check-identity-cards.cjs
      - name: Build public interface
        run: node scripts/build-public.js
      - name: Enforce public source and release boundary
        run: node scripts/security-public-boundary.cjs
      - name: Verify local dependencies and navigation
        run: node scripts/verify-public-links.cjs
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and enforce release boundary before upload
        run: |
          node scripts/build-public.js
          node scripts/security-public-boundary.cjs
          node scripts/verify-public-links.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published commit and required routes
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent "${SITE_URL}build-manifest.json" -o /tmp/manifest.json && node -e 'if(require("/tmp/manifest.json").commit!==process.env.EXPECTED_SHA)process.exit(1)'; then
              for route in index.html diagnostic.html student-path.html instructor.html student-login.html; do
                curl --fail --silent --output /dev/null "${SITE_URL}${route}" || exit 1
              done
              exit 0
            fi
            sleep 10
          done
          exit 1
