name: Deploy LexLearn AI demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check all shipped JavaScript
        run: |
          for f in assets/*.js namaa/assets/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Production guardrails
        run: |
          ! grep -R "async async" assets
          test -f privacy.html
          test -f terms.html
          test -f supabase/migrations/20261006_001_production_core.sql
          test -f supabase/migrations/20261006_002_hardening_and_qatar_curriculum.sql
          test -f supabase/functions/grade-answer/index.ts
          test -f supabase/functions/pilot-grade/index.ts
      - name: Adaptive engine tests
        run: |
          node tests/adaptive-engine.test.js
          node tests/learning-quality.test.js
          node tests/semantic-service.test.js
          node tests/review-bank.test.js
          node tests/pilot-learning.test.js
          node tests/pilot-grade-service.test.js
          node tests/pilot-readiness.test.js
          node tests/pilot-supervisor-audit.test.js
          node scripts/validate-pilot-grading.js
          node tests/program-flow.test.js
          node tests/public-showcase.test.js
          node tests/showcase-recall.test.js
          node tests/showcase-delivery.test.js
      - name: Conference registration smoke tests
        run: node tests/conference-signup.test.js
      - name: Conference landing release checks
        run: node tests/conference-landing.test.js
      - name: Production boundary tests
        run: node tests/production-boundaries.test.js

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build public artifact
        run: node scripts/build-public.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist-site"
      # GitHub Pages left a cancelled/failed 2026-10-14 deployment locked
      # despite its Actions job timing out. Cancel ONLY that obsolete SHA.
      # The current published site and all artifacts remain untouched.
      - name: Clear orphaned previous Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --location \
            --output /tmp/lexlearn-pages-cancel.json \
            --write-out '%{http_code}' \
            --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/e9efed2a10e9a1b95d8eb93c43afa2162c00c2cd/cancel")
          if [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "Previous cancelled Pages deployment cleanup response: $status"
          else
            echo "::warning::Previous Pages deployment cleanup returned $status"
          fi
      - name: Let artifact metadata become available
        run: sleep 12
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
