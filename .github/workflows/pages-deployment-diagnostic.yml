name: Diagnose stuck Web Summit Pages deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-deployment-diagnostic.yml']
permissions:
  contents: read
  deployments: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect only the repository's GitHub Pages deployment records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          def get(endpoint):
              url='https://api.github.com/repos/'+repo+endpoint
              req=urllib.request.Request(url,headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':'Bearer '+token,
                  'X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:
                      return res.status,json.load(res)
              except urllib.error.HTTPError as e:
                  return e.code,{'error':'endpoint failed','code':e.code}
              except Exception as e:
                  return None,{'error':str(type(e).__name__)}
          status,data=get('/deployments?environment=github-pages&per_page=40')
          print('GITHUB DEPLOYMENTS GET',status,'count',len(data) if isinstance(data,list) else 'n/a')
          if isinstance(data,list):
              for dep in data[:20]:
                  ident=dep.get('id')
                  st,states=get('/deployments/'+str(ident)+'/statuses?per_page=4')
                  print('DEPLOYMENT',ident,'sha',str(dep.get('sha'))[:12],'created',dep.get('created_at'),'statuses',[(x.get('state'),x.get('created_at')) for x in states[:3]] if isinstance(states,list) else st)
          status,pages=get('/pages')
          print('PAGES CONFIG GET',status,'source',pages.get('source') if isinstance(pages,dict) else '')
          status,build=get('/pages/builds/latest')
          print('PAGES LAST BUILD GET',status,'sha',build.get('commit') if isinstance(build,dict) else '')
          PY
