# Ephemeral local Supabase only. Never link this to LexLearn production.
project_id = "lexlearn-local-staging"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[auth]
enabled = true
site_url = "http://127.0.0.1:18765"
additional_redirect_urls = ["http://127.0.0.1:18765"]
jwt_expiry = 3600
enable_signup = false
[studio]
enabled = false
[inbucket]
enabled = false
[realtime]
enabled = false
[storage]
enabled = false
[analytics]
enabled = false

[functions.site-activity]
verify_jwt = false
[functions.admin-site-stats]
verify_jwt = true
